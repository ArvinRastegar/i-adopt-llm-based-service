[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iadopt-linking"
version = "0.1.0"
description = "Reproducible I-ADOPT entity-linking experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "iadopt-lab",
  "rdflib>=7.1,<8",
]

[project.optional-dependencies]
# The Qwen3 cross-encoder baseline; the same pins as the lab's `embeddings` extra.
rerank = ["sentence-transformers>=5.0,<6", "numpy>=2.2,<3"]

[project.scripts]
iadopt-linking = "iadopt_linking.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

# One-way and read-only: this project imports the lab's public APIs, the lab never imports this
# project, and nothing here may edit a path that feeds the lab's implementation hash.
[tool.uv.sources]
iadopt-lab = { path = "../iadopt-lab", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/iadopt_linking", "src/iadopt_linking_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
