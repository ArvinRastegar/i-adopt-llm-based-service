[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iadopt-lab"
version = "0.1.0"
description = "Reproducible I-ADOPT lexical decomposition experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "rdflib>=7.1,<8",
  "openai>=2.43,<3",
  "httpx>=0.28,<0.29",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5.0,<6", "numpy>=2.2,<3"]

[project.scripts]
iadopt-lab = "iadopt_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.26,<2", "hypothesis>=6.100,<7", "ruff>=0.11,<1", "numpy>=2.2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/iadopt_lab", "src/iadopt_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: requires dedicated PostgreSQL 16 test database", "embedding: requires hash-verified local embedding artifacts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
