# I-ADOPT Lab experiment parameters
#
# The only human-edited experiment configuration. `load_parameters` validates it
# against schemas/parameters.schema.json before any database or provider mutation;
# unknown fields and incompatible combinations are errors. Check readiness with
# `iadopt-lab preflight` before planning or running a campaign.
#
# Never put credentials in this file. Values such as OPENROUTER_API_KEY,
# PSNC_API_KEY, PSNC_API_BASE_URL, and DATABASE_URL are read from the named
# environment variables. The planned CLI may explicitly load the repository-root
# .env with --env-file ../.env when invoked from iadopt-lab/. Existing process
# environment values win; never execute, copy, hash, or persist the secret file.

schema_version: "2.1"

campaign:
  # Human-readable name. PostgreSQL assigns an immutable campaign identifier.
  name: "corpus-v2-decomposition-documentation-draft"

  # Choose [psnc], [openrouter], or [psnc, openrouter]. Order is display-only.
  # One run/resume invocation covers every enabled model of these providers.
  # Each task calls its own provider/model; there is no provider failover.
  # Scoped to OpenRouter for this campaign, mirroring the PSNC grid so the two are
  # comparable: same prompts, shot counts, temperatures and reasoning-off condition.
  providers: [openrouter]

  # Live execution must remain false until exact models, reasoning mappings,
  # evaluation-population manifest, price evidence, and pre-run estimate pass
  # preflight and the owner separately authorizes live execution.
  live_calls_enabled: true

# D-030: Corpus release v2.0.1. The release, commit and tree here must stay in
# step with schemas/parameters.schema.json, the ingestion constants, and every
# materialized manifest; they are changed together, never individually.
dataset:
  repository: "https://github.com/i-adopt/Corpus"
  release: "v2.0.1"
  commit: "2598bf91fa927b78a6529bae7864ef0f7d485b73"
  tree: "df665d32bb2433a60742c80a4a53908dc7ebde0c"
  expected_turtle_files: 102
  definition_predicate: "http://www.w3.org/2000/01/rdf-schema#comment"
  category_from_release_path: true

demonstrations:
  manifest: "data/manifests/demonstrations-v2.0.1.yml"
  exclude_all_from_scoring: true

evaluation_population:
  # All five demonstration variables are excluded. Every other variable in the
  # 102-variable Corpus v2.0.1 release is evaluated for every configuration.
  manifest: "data/manifests/evaluation-population-v2.0.1.yml"
  expected_variable_count: 97
  exclude_all_demonstrations: true

ranking:
  enabled: true

  # Accepted under D-023: sum contributions over all 97 variables to calculate
  # micro Close F1 separately for each repetition, then average those unrounded
  # repetition values. This is not the mean of 97 per-variable F1 values.
  # With D-029's one repetition, the mean equals that single micro Close F1.
  policy_version: "mean-repetition-micro-close-f1-v1"

  # A configuration is provider + model + reasoning profile + prompt + shots +
  # temperature + all other frozen scientific parameters. Repetition is a
  # repeated observation of that configuration, not a separate parameter set.
  primary_metric: "mean_repetition_micro_close_f1"
  direction: "descending"
  # Equal unrounded primary values share competition rank (1, 2, 2, 4).
  # The analysis columns below do not break ties.
  tie_policy: "shared_rank"
  secondary_metrics:
    - "mean_repetition_micro_exact_f1"
    - "valid_response_rate"

  # Preserve per-variable/component/repetition Exact and Close precision, recall,
  # F1 and their underlying confusion contributions in PostgreSQL. Descriptive
  # statistics under D-024 over per-variable scores (mean, median, variance, mode, standard
  # deviation, range, IQR) and uncertainty analyses are deferred until the
  # database is populated; none is required to generate or rank this campaign.

  # A configuration is rankable only after every expected variable/repetition
  # has a terminal scored result and no unresolved operational failure.
  require_complete_population: true
  retain_every_result: true

providers:
  psnc:
    adapter: "psnc_chat_completions"
    api_key_env: "PSNC_API_KEY"
    base_url_env: "PSNC_API_BASE_URL"
    default_base_url: "https://llm.hpc.psnc.pl/v1"
    chat_completions_path: "/chat/completions"
    client_library: "openai"
    # Measured, not guessed, and re-measured after D-041. The old limit of 2 was set while
    # reasoning was on and single calls ran 120-900s, where contention pushed requests past
    # the timeout. With reasoning disabled the workload is different: calls are ~2.6s, so
    # prefill contention no longer dominates. Re-measured on GLM-5.2 with 24 real 5-shot
    # prompts per level:
    #
    #   concurrency 2   28.2s wall    51 calls/min   p50 2.2s   max 4.6s   0 failures
    #   concurrency 4   18.0s wall    80 calls/min   p50 2.6s   max 5.5s   0 failures
    #   concurrency 8    9.0s wall   160 calls/min   p50 2.3s   max 6.4s   0 failures
    #
    # Raised to 24 for the full grid, measured separately at temperature 2 where calls
    # are long rather than frequent: 24 real prompts with 24 slots ran all 24 in flight
    # for 207s with zero failures. At that temperature the request RATE is low (a slot
    # is held ~200s), so concurrency, not the rate guard, is the binding constraint.
    #
    # 8 is a 2.96x speedup over 2 with no failures and no median-latency cost; only the
    # tail grows, from 4.6s to 6.4s, which is far inside the timeout. Repeating level 2
    # afterwards returned 24.9s, faster than its first run, so the load left no degradation.
    # 120s, set by the owner. Adequate for every reasoning-OFF campaign here (PSNC calls
    # are 0.7-3.3s) and deliberately NOT adequate for reasoning-on: measured at 120s,
    # GLM-5.2 timed out on 12 of 16 calls and Qwen3.8-27B on 8-9 of 16, at every
    # concurrency tried. PSNC reasoning-enabled is therefore excluded rather than run
    # with a timeout it would fail. See D-044.
    timeout_seconds: 120
    max_concurrency: 24
    # Both guards are self-imposed - PSNC publishes neither - and both must be sized to
    # permit the configured concurrency, or admission throttles the campaign against its
    # own settings rather than against the provider. At concurrency 8 the measured rate is
    # ~160 requests/minute, and the conservative admission bound is ~22,200 tokens per
    # request (about 5,900 prompt bytes + 256 overhead + the 16,000 ceiling), so ~160
    # requests/minute is ~3.5M tokens/minute. The previous 100 rpm / 3M tpm were sized for
    # concurrency 2 and gated BOTH, which is what turned throttling into a campaign
    # failure. These values leave headroom for the fastest observed model rather than
    # tracking the average.
    requests_per_minute: 1200
    tokens_per_minute: 40000000

    billing:
      # The owner reports PSNC access is free for this experiment. Record that
      # basis in the billing manifest; this is not a universal price claim.
      mode: "non_billed"
      basis: "Owner-reported no-charge PSNC access for this experiment"
      maximum_provider_cost:
        amount: null  # No spending cap; non_billed independently establishes zero cost.
        # USD, matching cost_accounting.reporting_currency and the price cards. A provider
        # cap declared in a different unit from the campaign is refused at registration,
        # and a null amount in the wrong currency is still a mismatch.
        currency: "USD"

    # The three exact IDs supplied by the owner. Capabilities below are written by
    # `iadopt-lab probe-models --provider psnc --model ... --write`, which sorts the
    # entries by id and measures each model instead of inferring it: one probe with no
    # reasoning field to learn the model's default, one with
    # chat_template_kwargs.enable_thinking=false to learn whether the switch changes
    # that default, and one with response_format to test native structured output. A
    # model whose reasoning could not be switched off is written back disabled, with
    # the measurement that disqualified it recorded beside it.
    # Enabled selects a model; it does not authorize calls or assert availability.
    # Unknown capabilities/profiles block freezing a plan and live execution.
    # Add/remove/rename models before a new campaign; three is not a fixed limit.
    models:
      - id: "DeepSeek-V4-Flash"
        display_name: "DeepSeek-V4-Flash on PSNC"
        enabled: true
        # Emitted no reasoning in either probe, so there is no control to declare. This records two clean observations, not a guarantee the model never reasons.
        revision: null
        context_window_tokens: 1048576
        capabilities:
          temperature: true
          top_p: true
          seed: true
          structured_output: true
          reasoning_control: false
          evidence:
            source: "iadopt-lab probe-models against https://llm.hpc.psnc.pl: context_window and parameter support from the LiteLLM /model/info catalog; reasoning control, structured output and parameter acceptance from live chat/completions probes. Sampling capabilities record that the deployment ACCEPTED the parameter and that its catalog lists it, not that the value was shown to change the output."
            verified_at: "2026-09-09"
        reasoning_profiles:
          - mode: "not_applicable"
            request_fields: {}
      - id: "GLM-5.2"
        display_name: "GLM-5.2 on PSNC"
        enabled: true
        # Reasoning switched off: 355 characters of thinking with no control, 0 with enable_thinking=false.
        revision: null
        context_window_tokens: 1048576
        capabilities:
          temperature: true
          top_p: true
          seed: true
          structured_output: true
          reasoning_control: true
          evidence:
            source: "iadopt-lab probe-models against https://llm.hpc.psnc.pl: context_window and parameter support from the LiteLLM /model/info catalog; reasoning control, structured output and parameter acceptance from live chat/completions probes. Sampling capabilities record that the deployment ACCEPTED the parameter and that its catalog lists it, not that the value was shown to change the output."
            verified_at: "2026-09-09"
        reasoning_profiles:
          - mode: "disabled"
            request_fields:
              chat_template_kwargs:
                enable_thinking: false
      - id: "Qwen3.8-27B"
        display_name: "Qwen3.8-27B on PSNC"
        enabled: true
        # Reasoning switched off: 147 characters of thinking with no control, 0 with enable_thinking=false.
        revision: null
        context_window_tokens: 262144
        capabilities:
          temperature: true
          top_p: true
          seed: true
          structured_output: true
          reasoning_control: true
          evidence:
            source: "iadopt-lab probe-models against https://llm.hpc.psnc.pl: context_window and parameter support from the LiteLLM /model/info catalog; reasoning control, structured output and parameter acceptance from live chat/completions probes. Sampling capabilities record that the deployment ACCEPTED the parameter and that its catalog lists it, not that the value was shown to change the output."
            verified_at: "2026-09-09"
        reasoning_profiles:
          - mode: "disabled"
            request_fields:
              chat_template_kwargs:
                enable_thinking: false
  openrouter:
    adapter: "openrouter_chat_completions"
    api_key_env: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    chat_completions_path: "/chat/completions"
    client_library: "openai"
    # Self-imposed operational guards, not published OpenRouter limits: OpenRouter
    # meters by credit rather than a documented RPM/TPM. Sized for the grid-wide
    # 100,000-token ceiling (D-038): the conservative admission bound is about
    # 103,000 tokens per request, so 600,000 would gate dispatch to five requests a
    # minute regardless of concurrency, and a 180s timeout risks the ambiguous
    # deliveries seen on PSNC. Both scaled to match the PSNC block so the two
    # providers stay comparable.
    # 120s, set by the owner for the unattended run. Measured against it: OpenRouter
    # reasoning-on calls have p50 26-41s and max 94-117s, so 120s clears the observed tail
    # with little margin. PSNC reasoning-on does NOT fit and is excluded; see D-044.
    timeout_seconds: 120
    # 8, not 4. Measured: at 8 the upstream behind qwen/qwen3-8b (Alibaba) returned HTTP
    # 429 on 37 of 664 calls while the other two models had none, and each 429 consumes one
    # of that task's three attempts. Cooldown is per-PROVIDER, not per-model, so one
    # model's upstream limit stalls the whole gateway - halving concurrency is the lever
    # available without per-model gating.
    #   qwen3-8b   conc 4 -> 16/16 ok, 0 timeouts, max 117.0s,  5.69 tasks/min
    #   qwen3-8b   conc 8 -> 16/16 ok, 0 timeouts, max 105.6s,  7.16 tasks/min
    #   qwen3-32b  conc 4 -> 14/16 ok, 0 timeouts, max  96.5s,  5.35 tasks/min
    #   qwen3-32b  conc 8 -> 16/16 ok, 0 timeouts, max  94.6s, 10.15 tasks/min
    # Maximum latency FELL from 4 to 8 on both models, so the gateway is not saturating at
    # 8 and the higher rate is free. Held at 8 rather than pushed further because qwen3-8b
    # is rate-limited upstream by Alibaba (144 failures in campaign 844df00e).
    max_concurrency: 8
    requests_per_minute: 100
    tokens_per_minute: 3000000

    billing:
      mode: "metered"
      basis: "Frozen OpenRouter model price evidence required before live use"
      maximum_provider_cost:
        # Null here: the binding limit is the campaign-wide cap, so the budget is not
        # split per provider. Currency must still match the campaign's reporting unit.
        amount: null
        currency: "USD"

    # D-032: three OpenRouter models, independent of the PSNC list.
    # openai/gpt-4o-mini replaces inclusionai/ling-3.0-flash; the two Qwen
    # entries are unchanged. Unlike the other five selections it is a hosted
    # closed-weight model, so metered price evidence is mandatory before live use.
    # Names, list length, and selected providers may change before a new campaign.
    models:
      - id: "meta-llama/llama-3.1-8b-instruct"
        display_name: "meta-llama/llama-3.1-8b-instruct on OPENROUTER"
        enabled: true
        # Emitted no reasoning in either probe, so there is no control to declare. This
        # records two clean observations, not a guarantee the model never reasons.
        revision: null
        context_window_tokens: 131072
        capabilities:
          temperature: true
          top_p: true
          seed: true
          structured_output: true
          reasoning_control: false
          max_output_tokens: 117964
          evidence:
            source: "iadopt-lab probe-models against https://openrouter.ai/api/v1: context_length, max_completion_tokens and per-token pricing from the OpenRouter /models catalog; reasoning behaviour, structured output and parameter acceptance from live chat/completions probes on 2026-09-10. Sampling capabilities record that the deployment ACCEPTED the parameter and that its catalog lists it, not that the value was shown to change the output."
            verified_at: "2026-09-10"
        reasoning_profiles:
          - mode: "not_applicable"
            request_fields: {}
      - id: "mistralai/ministral-8b-2512"
        display_name: "mistralai/ministral-8b-2512 on OPENROUTER"
        enabled: true
        # Emitted no reasoning in either probe, so there is no control to declare.
        revision: null
        context_window_tokens: 262144
        capabilities:
          temperature: true
          top_p: true
          seed: true
          structured_output: true
          reasoning_control: false
          max_output_tokens: 209715
          evidence:
            source: "iadopt-lab probe-models against https://openrouter.ai/api/v1: context_length, max_completion_tokens and per-token pricing from the OpenRouter /models catalog; reasoning behaviour, structured output and parameter acceptance from live chat/completions probes on 2026-09-10. Sampling capabilities record that the deployment ACCEPTED the parameter and that its catalog lists it, not that the value was shown to change the output."
            verified_at: "2026-09-10"
        reasoning_profiles:
          - mode: "not_applicable"
            request_fields: {}
      - id: "z-ai/glm-5.2"
        display_name: "z-ai/glm-5.2 on OPENROUTER"
        enabled: true
        # GLM-5.2 reached through OpenRouter instead of PSNC. On PSNC this model reasons for
        # 3,111 output tokens and 233s per call, which cannot fit the 120s timeout (D-044).
        # Through OpenRouter the same model reasons far more briefly: measured 772 output
        # tokens in 14.0s, 3/3 valid JSON, on real 5-shot prompts. That is the whole reason
        # this entry exists.
        revision: null
        context_window_tokens: 1048576
        capabilities:
          temperature: true
          top_p: true
          seed: true
          structured_output: true
          reasoning_control: true
          max_output_tokens: 128000
          evidence:
            source: "iadopt-lab probe-models and direct measurement against https://openrouter.ai/api/v1 on 2026-09-10: context_length, max_completion_tokens and per-token pricing from the /models catalog; reasoning behaviour and token usage from live chat/completions calls on real 5-shot prompts."
            verified_at: "2026-09-10"
        reasoning_profiles:
          - mode: "enabled"
            request_fields:
              reasoning:
                enabled: true
      - id: "openai/gpt-4o-mini"
        display_name: "openai/gpt-4o-mini on OPENROUTER"
        enabled: false  # Complete in campaign 844df00e; see docs/campaign-log.md
        # Emitted no reasoning in either probe, so there is no control to declare. This records two clean observations, not a guarantee the model never reasons.
        revision: null
        context_window_tokens: 128000
        capabilities:
          temperature: true
          top_p: true
          seed: true
          structured_output: true
          reasoning_control: false
          max_output_tokens: 16384
          evidence:
            source: "iadopt-lab probe-models against https://openrouter.ai/api/v1: context_window and parameter support from the LiteLLM /model/info catalog; reasoning control, structured output and parameter acceptance from live chat/completions probes. Sampling capabilities record that the deployment ACCEPTED the parameter and that its catalog lists it, not that the value was shown to change the output."
            verified_at: "2026-09-10"
        reasoning_profiles:
          - mode: "not_applicable"
            request_fields: {}
      - id: "qwen/qwen3-32b"
        display_name: "qwen/qwen3-32b on OPENROUTER"
        enabled: true
        # Reasoning-ENABLED arm. The disabled arm is complete in campaign 844df00e.
        # Measured with reasoning on: 32.4s, 1,065 output tokens, 16/16 under a 120s
        # timeout at concurrency 8.
        # Reasoning switched off: 3243 characters of thinking with no control, 0 with enable_thinking=false.
        revision: null
        context_window_tokens: 131072
        capabilities:
          temperature: true
          top_p: true
          seed: true
          structured_output: true
          reasoning_control: true
          max_output_tokens: 16384
          evidence:
            source: "iadopt-lab probe-models against https://openrouter.ai/api/v1: context_window and parameter support from the LiteLLM /model/info catalog; reasoning control, structured output and parameter acceptance from live chat/completions probes. Sampling capabilities record that the deployment ACCEPTED the parameter and that its catalog lists it, not that the value was shown to change the output."
            verified_at: "2026-09-10"
        reasoning_profiles:
          # Enable and disable use DIFFERENT channels on this model. Disabling needs the
          # `/no_think` prompt suffix because OpenRouter drops chat-template arguments;
          # enabling works through the ordinary request field. Only the enabled arm runs
          # here - the disabled arm is already complete in campaign 844df00e.
          - mode: "enabled"
            request_fields:
              reasoning:
                enabled: true
      - id: "qwen/qwen3-8b"
        display_name: "qwen/qwen3-8b on OPENROUTER"
        enabled: true
        # Reasoning-ENABLED arm. The disabled arm is complete in campaign 844df00e.
        # Measured with reasoning on: 29.9s, 1,187 output tokens, 16/16 under a 120s
        # timeout at concurrency 8.
        # Reasoning switched off: 1184 characters of thinking with no control, 0 with enable_thinking=false.
        revision: null
        context_window_tokens: 131072
        capabilities:
          temperature: true
          top_p: true
          seed: true
          structured_output: true
          reasoning_control: true
          max_output_tokens: 8192
          evidence:
            source: "iadopt-lab probe-models against https://openrouter.ai/api/v1: context_window and parameter support from the LiteLLM /model/info catalog; reasoning control, structured output and parameter acceptance from live chat/completions probes. Sampling capabilities record that the deployment ACCEPTED the parameter and that its catalog lists it, not that the value was shown to change the output."
            verified_at: "2026-09-10"
        reasoning_profiles:
          # Only the enabled arm runs here; the disabled arm is complete in campaign
          # 844df00e, where this model also produced all 144 upstream rate-limit failures.
          - mode: "enabled"
            request_fields:
              reasoning:
                enabled: true
# Before freezing a plan, replace capabilities:null with verified booleans for
# temperature, seed, structured_output, and reasoning_control. A reasoning-
# capable model needs two reasoning_profiles (disabled/enabled) with exact native
# request_fields; an incapable model needs not_applicable with request_fields:{}.
# Do not infer capabilities from a model name or from example calls that omit
# reasoning controls. Draft live:false allows unknown capability profiles; plan
# and live preflight must reject them. See docs/model-catalog.md.

parameter_grid:
  # Scoped to a single configuration for the first live run. The full grid
  # (3 prompts x 4 shot counts x 4 temperatures) returns for the real campaign.
  prompt_variants:
    - "strict-minimal"
    - "constraint-decomposition"
    - "matrix-decomposition"

  # Non-zero values select an ordered prefix of the approved five demonstrations.
  shot_counts: [0, 1, 3, 5]
  # Temperature 2.0 is dropped from this campaign. It was measured, not assumed: at 2.0
  # the sampling distribution is flat enough that the stop token rarely wins, so generation
  # runs toward the output ceiling. Measured against the 16,000-token ceiling with reasoning
  # off, on 24 real 5-shot prompts per model:
  #
  #   temperature 0.0-1.0   0.7-6.3s per call    55-133 completion tokens   0/32 truncated
  #   temperature 2.0       up to 95.8s          up to 6,997 tokens         ~40% truncated
  #
  # A truncated response is a non-retryable operational failure, so under
  # ranking.require_complete_population every temperature-2.0 configuration would be
  # unrankable. It would have consumed most of the runtime to produce almost no rankable
  # result. See D-043; restoring 2.0 needs the truncation question settled first.
  temperatures: [0.0, 0.5, 1.0]

  # D-029: one repetition at EVERY temperature for all selected providers/models.
  # This reduces tasks/calls by 75% versus the former 1-at-zero/5-at-nonzero grid.
  # Keep both fields and repetition identities for future campaign configurability.
  # Retries are separate: a task still permits at most three provider requests.
  repetitions:
    temperature_zero: 1
    nonzero_temperature: 1

  # These scientific values were not yet approved. Null blocks live preflight;
  # the final values must be capability-valid for every enabled model.
  top_p: 1.0
  # Sized from measured evidence, not set high and hoped for. A ceiling is free in
  # billing terms but NOT in time: with 100,000 allowed, GLM-5.2 kept reasoning until
  # our 900s timeout killed the request, and 18 of 31 requests died that way, each
  # burning a worker slot for 15 minutes and producing nothing.
  #
  # Every successful GLM-5.2 response recorded so far fits well inside 16,000: the
  # largest is 8,605 completion tokens and the run before it peaked at 5,613. At the
  # observed 20-28 tokens per second, 16,000 caps a single request near 800 seconds,
  # inside the timeout, so a runaway is truncated rather than left to hang. That makes
  # truncation improbable while keeping the run bounded. See D-040.
  # 8,000 for the OpenRouter campaign, down from the 16,000 used on PSNC (D-040). Not a
  # scientific change: it is bounded by qwen/qwen3-8b, whose provider caps completion at
  # 8,192, and the ceiling has never been approached. Across 10,946 PSNC calls with
  # reasoning off the largest completion was 254 tokens, so 8,000 still leaves ~30x
  # headroom while keeping one ceiling shared by every model in the grid rather than a
  # per-model limit that would make the runs incomparable.
  max_output_tokens: 8000

generation:
  output_schema: "schemas/lexical-decomposition.schema.json"

  # Disabled to keep the main comparison protocol common across models/providers.
  provider_native_structured_output: false

  # Three provider requests TOTAL per fully resolved variable task:
  # Attempt 1 is initial. Attempts 2/3 may correct content-invalid responses or
  # resend after a classified safe transient failure; all share this total of 3.
  max_generation_attempts_per_task: 3

  # SDK/provider clients may not add inner generation retries.
  provider_sdk_auto_retries: 0

  correction_attempt:
    preserve_scientific_parameters: true
    include_previous_raw_response: true
    include_validation_errors: true

  retryable_results:
    - "empty_response"
    - "html_response"
    - "no_json_found"
    - "json_parse_error"
    - "schema_validation_error"
    - "semantic_validation_error"
    - "classified_transient_provider_error"

evaluation:
  # Accepted D-022 protocol: one-to-one system-member partial credit in both
  # simple/system directions and system/system comparisons. Container labels
  # are excluded; matched/missing/extra counts determine fractional TP/FN/FP.
  # Code hash and embedding artifact must still be frozen before execution.
  scorer_version: "january-derived-member-credit-v1"
  similarity_model: "sentence-transformers/all-MiniLM-L6-v2"
  similarity_model_revision: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
  similarity_threshold: 0.80
  score_symmetric_system_identifier: false
  score_asymmetric_system_identifier: false
  terminal_invalid_prediction: "explicit_empty"

database:
  dsn_env: "DATABASE_URL"
  required_major_version: 16

  # This is a mandatory versioned protocol, not a switch for dropping evidence.
  # It requires full prompts, sanitized requests, raw responses, extraction and
  # validation evidence, predictions, item/component scores, every repetition,
  # Exact/Close precision/recall/F1 with confusion contributions and denominators,
  # every aggregate/rank, usage/cost, and state history.
  evidence_policy: "complete-v1"

cost_accounting:
  # Covers every selected provider/model: metered prices or documented zero-cost
  # non_billed access. Inactive providers need no credentials/pricing evidence.
  # Unknown price is never zero. Null blocks live campaign authorization.
  # One card covering every enabled PSNC model. `cost_policy` refuses a model with
  # no entry, and refuses before reading the billing mode, so a non-billed provider
  # does not exempt a model from carrying evidence.
  price_card_manifest: "data/manifests/price-card-openrouter.yml"
  # Prices are published in USD; reporting in USD avoids inventing an FX rate.
  reporting_currency: "USD"
  require_complete_price_evidence_before_live: true
  # D-027: disclose model/provider totals, token and retry assumptions, expected
  # scenarios and a conditional worst-case estimate before any live execution.
  # An estimate is not a spending ceiling. No paid calibration is implicit.
  require_pre_run_estimate: true
  estimate_policy_version: "pre-run-estimate-v1"

execution:
  # One invocation advances all selected grids through generation, validation,
  # scoring, aggregation, ranking, and required reports, with durable checkpoints.
  continue_until_complete: true
  continue_unaffected_providers: true
  scheduler: "provider_fair"

  # Matched to psnc.max_concurrency so the pool can actually fill the provider gate;
  # a smaller worker count would cap dispatch below the measured provider capacity.
  # Matched to the OpenRouter gate so the pool can fill it; both campaigns that remain
  # run against OpenRouter.
  worker_count: 8
  resume_enabled: true
  task_lease_seconds: 300
  heartbeat_seconds: 30

  # Optional only: null means no enforced monetary ceiling, not missing approval
  # or zero cost. Zero means an actual zero ceiling if explicitly configured.
  # Account for every call; atomically enforce only non-null optional caps.
  # The owner receives a cost estimate and authorizes live work before dispatch.
  maximum_campaign_cost:
    # Hard cap set by the owner for the OpenRouter campaign. Enforced atomically at
    # admission: a reservation is refused once spent + reserved + this attempt would
    # exceed it, so the campaign pauses on budget instead of overspending. Currency is USD
    # to match cost_accounting.reporting_currency and the price card; leaving it EUR while
    # every amount was USD would have compared different units.
    # $40. Expected spend is $8.50 from per-model measured token usage, or $13.71 on the
    # disclosed estimate, which conservatively assumes 1,200 output tokens for every model
    # including ones measured at 46. $40 is ~3x the conservative figure and ~5x the
    # realistic one, while still stopping far below the $204.95 theoretical worst case.
    # Raised from $25 because 1.8x headroom is too thin for an unattended multi-day run:
    # hitting the cap pauses the campaign, and a pause nobody is watching wastes the night.
    amount: 40
    currency: "USD"

reporting:
  group_by:
    - "evaluation_population"
    - "provider"
    - "model"
    - "reasoning_profile"
    - "prompt_variant"
    - "shot_count"
    - "temperature"
    - "repetition"
    - "category"
    - "subcategory"
    - "component"
    - "configuration_rank"
    - "rankability_status"
